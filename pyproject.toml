[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jira-task-analytics"
version = "1.0.0"
description = "Six analytics reports for Jira projects"
requires-python = ">=3.10"
dependencies = ["requests>=2.31,<3", "matplotlib>=3.8,<4", "PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
jira-analytics = "jira_analytics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
